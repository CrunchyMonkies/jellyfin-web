server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Serve the Jellyfin web client at /web with SPA fallback for client-side routes.
    location /web/ {
        alias /usr/share/nginx/html/web/;
        try_files $uri $uri/ /web/index.html;
    }

    # Bare root -> the web client. API paths are routed to the Jellyfin server by the
    # Gateway/HTTPRoute (they never reach this nginx).
    location = / {
        return 302 /web/;
    }

    location /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
